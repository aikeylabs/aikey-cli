# CI gate — runs unit + integration tests on every push and PR.
# Project rule: 持续交付 = CI/CD 失败即失败. A non-zero exit blocks the PR.
#
# The lifecycle E2E tests resolve the binary under test via the
# cargo-provided CARGO_BIN_EXE_aikey, and a controlled-behavior `mock_proxy`
# Go binary at target/test-bin/mock_proxy. We build mock_proxy here so those
# E2E scenarios actually run; tests that additionally need a real
# aikey-proxy binary (a separate repo) self-skip — they are designed not to
# fail CI when the proxy isn't present.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: Swatinem/rust-cache@v2
      # 🔴 provider_fingerprint's golden-parity test reads
      # ../pkg/providerroutes/testdata/registry_golden.json — the answer set Go
      # exports, which is the entire point of a CROSS-LANGUAGE parity test: Rust
      # and Go must agree on one fixture, not on two copies. The path is relative
      # to the crate root, so pkg has to sit beside this checkout the way it does
      # in the monorepo working tree.
      #
      # 🔴 develop-v1.0.5, not the default branch: six of pkg's module
      # directories do not exist on main. The test panics rather than skipping
      # when the file is absent, and it is right to — a parity test that skips
      # when it cannot find the other language's answers reports the same green
      # as one that agreed.
      - name: Check out pkg beside this checkout (cross-language parity fixture)
        env:
          TOKEN: ${{ secrets.AIKEY_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::AIKEY_CI_TOKEN is not configured. The Rust↔Go parity test" \
                 "reads its expectations from the private sibling pkg/. Refusing to run" \
                 "a suite whose parity half cannot execute."
            exit 1
          fi
          url="https://x-access-token:${TOKEN}@github.com/AiKeyLabs/pkg.git"
          for ref in "${{ github.head_ref || github.ref_name }}" develop-v1.0.5; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$url" "$ref" >/dev/null 2>&1; then
              echo "::notice::pkg @ ${ref}"
              git clone --quiet --depth 1 --branch "$ref" "$url" "$(dirname "$GITHUB_WORKSPACE")/pkg"
              break
            fi
          done
          test -f "$(dirname "$GITHUB_WORKSPACE")/pkg/providerroutes/testdata/registry_golden.json" \
            || { echo "::error::pkg checked out without the golden fixture"; exit 1; }
      - name: Build mock_proxy (enables lifecycle E2E)
        run: make build-mock-proxy
      - name: cargo test
        run: cargo test --workspace
