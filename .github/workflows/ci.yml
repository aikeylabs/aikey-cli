# CI gate — runs unit + integration tests on every push and PR.
# Project rule: 持续交付 = CI/CD 失败即失败. A non-zero exit blocks the PR.
#
# The lifecycle E2E tests resolve the binary under test via the
# cargo-provided CARGO_BIN_EXE_aikey, and a controlled-behavior `mock_proxy`
# Go binary at target/test-bin/mock_proxy. We build mock_proxy here so those
# E2E scenarios actually run; tests that additionally need a real
# aikey-proxy binary (a separate repo) self-skip — they are designed not to
# fail CI when the proxy isn't present.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: Swatinem/rust-cache@v2
      - name: Build mock_proxy (enables lifecycle E2E)
        run: make build-mock-proxy
      - name: cargo test
        run: cargo test --workspace

      # 🔴 These two fences shipped with NO RUNNER (found 2026-08-11 while
      # doing task 7.8). Neither had ever run outside the session that wrote
      # it, and a fence that cannot fail is indistinguishable from one that
      # is satisfied.
      - name: guard — --from-url does not branch on edition (T-EDN-1)
        run: |
          ./scripts/check-from-url-edition-parity.sh
          ./scripts/check-from-url-edition-parity.sh --self-test

      # 🔴 The self-test only. The composition check itself is EXPECTED to be
      # red while the change sits on its feature branch — that is the true
      # state, not a CI failure. What must stay green is the checker's own
      # ability to tell present from absent, including the
      # infer_provider_from_url false positive it exists to survive.
      - name: guard — release-composition checker still works (task 7.8)
        run: ./scripts/check-release-composition.sh --self-test 2>&1 | tee /tmp/comp.log; grep -q 'self-test ㈠' /tmp/comp.log && ! grep -q 'FAIL.*self-test' /tmp/comp.log
