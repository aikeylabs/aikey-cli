# Provider Fingerprint Registry (POC)
#
# 用途：对已抽取的 secret token 做 provider 软性分类 + 二次校验 + 上游路由/模型映射真相源
# Why YAML：单一真相源、跨语言（Rust serde / Go yaml.v3）共读的声明式配置。
#   🔴 勘误（2026-07-18）：本文件**编译期内嵌**（Rust include_str! / Go go:embed），
#   **不是** ControlPanel 下发热更。改任一行 = 改源码 = 重编译四消费方 = 走完整发版
#   （round +1，Stage 4-6 重跑）。runtime override + 签名校验是 B8（Rust doc 自陈 v1.1+），本期不做。
#   🔴 本文件随二进制分发给所有客户，是**公开的厂商事实表** —— 🚫 严禁写入任何 secret / key /
#   base_url_override / 客户数据（越级反例：用第 1 级安全换第 8 级实现）。
#
# tier 含义：
#   confirmed  —— 前缀极具特异性，FP 几乎为 0（sk-ant-api03 / AKIA / gsk_ 等）
#   likely     —— 前缀有特征但可能与别的 provider 共享（sk-or-v1 OpenRouter vs sk-or 其他）
#   ambiguous  —— 无特异前缀，需要 URL / title 上下文辅助（Kimi/DeepSeek 共享 sk-）
#   warn       —— 形态像 credential 但大概率不是（UUID / pure hex 短串）
#
# 来源：
#   - Anthropic 官方文档 + GitGuardian detector
#   - GitHub odomojuli/regextokens 仓库
#   - 各 provider 官方 quickstart (openai.com / groq.com / x.ai / etc.)
#   - 2026-04 web 检索

version: 1

