# v4.3 (2026-05-01) · provider_routes: per-host upstream routing table.
#
# 用途: 用一张声明式表代替原 family_base_urls + host_to_base_url 两层映射 +
# proxy applyBaseURL 的 tail-overlap dedup 算法。每行 = 一个 host 的完整路由
# 声明; 新加 gateway 加一行,不动代码。
#
# 字段语义:
#   host       URL host portion (用户粘贴 / vault 存储 base_url 抽出的 host)
#   protocol   匹配 aikey-proxy provider registry 的 protocol 名 (anthropic /
#              openai_compatible / gemini),决定 RewriteRequest 实现
#   provider   canonical provider_code (写入 vault.entries.provider_code,
#              CLI / UI / DB 一致使用; 同 provider 可有多 host 行,如 kimi
#              下 api.kimi.com 与 api.moonshot.cn 都是 provider=kimi)
#   base_url   上游 root URL (host + 任何 path prefix BEFORE version,不含 version)
#   version    API version path 段,proxy 会显式 append; 部分 provider 无 version
#              (perplexity 直接 /chat/completions),写空字符串
#
# proxy 拼接规则 (一条数学规则):
#   final_url = base_url + version + (request_path 剥掉 leading version 后的部分)
# 客户端可能带 /v1 (kimi-cli / anthropic SDK), 也可能不带 (OpenAI SDK 把 /v1
# 当作 base_url 的一部分自己 append) —— 都被 strip 一次后由 proxy 显式补回,
# 拼出去重唯一的 upstream URL。无 if/else 特例。
#
# Web import "use official" 按钮:
#   user 粘贴 URL → 抽 host → lookup → official URL = base_url + version
#
# 数据来源 (2026-05-01 校对; 2026-05-08 Kimi 双平台拆分修订;
#           2026-08-02 provider-credential-cascade 扩表 23 → 50 行):
#
# 2026-08-02 本轮新增厂商与调研分档 —— 逐条来源链接 + 抓取日期见
#   roadmap20260320/技术实现/阶段8-平台化/供应商凭据三级联动/
#   openspec/changes/provider-credential-cascade/research-provider-endpoints.md
#
#   A 档 (官方文档逐字抓取, 直接进表):
#     anthropic 第二协议面 —— deepseek / moonshot(.cn+.ai) / qwen(百炼
#       claude-code-proxy) / doubao(方舟 Coding Plan) / minimax(国内+国际) /
#       zhipu(api.z.ai)
#     openai_compatible 新厂商 —— mistral / minimax / stepfun / hunyuan /
#       qianfan / together(.ai 规范 + .xyz 旧域名) / fireworks / cerebras /
#       github_models / vercel_gateway
#   B 档 (二级来源一致, 未取得官方原文; YAML 行内标 `# tier-B 待官方复核`,
#         界面显示「社区验证」角标):
#     zhipu 的 api.z.ai openai 面 / sambanova / aihubmix(主+备) / ai302
#   C 档 (🚫 不进表, 未采纳原因见 research-provider-endpoints.md §3):
#     cohere / yi / azure_openai / bedrock / vertex_ai /
#     ollama·lmstudio·vllm(见 R-5) / novita·deepinfra·hyperbolic·nebius /
#     客户自建 one-api·new-api·企业反代 (结构上进不了 host-keyed 表)
#
# 🔴 本表是 2026-08-02 的快照且**编译期内嵌**。厂商随时可能改地址(风险 X-7),
#    而 **CI 不会告诉你某个厂商今天改了 URL** —— 那是测试方案 §6「路由表体检」
#    这份人工发版前清单负责的事。
#
# 原始数据来源 (2026-05-01):
#   - Anthropic:   官方 https://api.anthropic.com/v1
#   - OpenAI:      官方 https://api.openai.com/v1
#   - Kimi Code:   https://api.kimi.com/coding/v1 (sk-kimi-* KEY 形态稳定 → confirmed regex)
#   - Moonshot:    https://api.moonshot.cn/v1 (无稳定前缀,只能靠 URL/keyword 兜底;
#                  与 Kimi Code 同 family=kimi 但 provider_code 已拆为独立的 moonshot)
#   - DeepSeek / Groq / xAI / OpenRouter / Perplexity / Gemini / Zhipu /
#     Doubao / Qwen / SiliconFlow / HuggingFace / Yunwu / Zeroeleven 同上游
#     官方文档,详见各 provider 主页。
provider_routes:
  - { host: "api.anthropic.com",                  protocol: anthropic,         provider: anthropic,     base_url: "https://api.anthropic.com",                  version: "/v1"     }
  - { host: "api.openai.com",                     protocol: openai_compatible, provider: openai,        base_url: "https://api.openai.com",                     version: "/v1"     }
  # Master-resident Mock Provider. The stable logical host is public build
  # metadata; edition-specific reachable addresses are written as each Mock
  # credential's base_url_override by Master.
  - { host: "mock-provider.aikey.internal", path_prefix: "/anthropic", protocol: anthropic,         provider: mock, base_url: "http://mock-provider.aikey.internal/anthropic", version: "/v1" }
  - { host: "mock-provider.aikey.internal", path_prefix: "/openai",    protocol: openai_compatible, provider: mock, base_url: "http://mock-provider.aikey.internal/openai",    version: "/v1" }
  - { host: "api.kimi.com",                       protocol: openai_compatible, provider: kimi_code,     base_url: "https://api.kimi.com/coding",                version: "/v1", default: true }
  - { host: "www.kimi.com",                       protocol: openai_compatible, provider: kimi_code,     base_url: "https://api.kimi.com/coding",                version: "/v1"     }
  - { host: "api.moonshot.cn",                    protocol: openai_compatible, provider: moonshot,      base_url: "https://api.moonshot.cn",                    version: "/v1", default: true }
  - { host: "platform.moonshot.cn",               protocol: openai_compatible, provider: moonshot,      base_url: "https://api.moonshot.cn",                    version: "/v1"     }
  - { host: "api.deepseek.com",                   protocol: openai_compatible, provider: deepseek,      base_url: "https://api.deepseek.com",                   version: "/v1"     }
  - { host: "api.groq.com",                       protocol: openai_compatible, provider: groq,          base_url: "https://api.groq.com/openai",                version: "/v1"     }
  - { host: "api.x.ai",                           protocol: openai_compatible, provider: xai,           base_url: "https://api.x.ai",                           version: "/v1"     }
  - { host: "openrouter.ai",                      protocol: openai_compatible, provider: openrouter,    base_url: "https://openrouter.ai/api",                  version: "/v1"     }
  - { host: "api.perplexity.ai",                  protocol: openai_compatible, provider: perplexity,    base_url: "https://api.perplexity.ai",                  version: ""        }
  - { host: "generativelanguage.googleapis.com",  protocol: gemini,            provider: google,         base_url: "https://generativelanguage.googleapis.com",  version: "/v1beta" }
  # zhipu / GLM (open.bigmodel.cn) 一 host 三协议端点 —— P1b/D-2b 扩键 (host, path_prefix)。
  # 兜底行 path_prefix:"" 保持既有 openai_compatible + /api/paas 语义不变（向后兼容，18 行零改动围栏锁定）。
  # 另两行显式 path_prefix，让客户粘贴的 /api/anthropic 与 /api/coding/paas/v4 端点各自命中正确协议/base_url。
  - { host: "open.bigmodel.cn",                   protocol: openai_compatible, provider: zhipu,         base_url: "https://open.bigmodel.cn/api/paas",          version: ""       }
  # 2026-08-02 provider-credential-cascade / I-5: `default: true` added.
  # api.z.ai also serves zhipu's /api/anthropic face, so (zhipu, anthropic) now
  # matches TWO rows and NEITHER has an empty path_prefix → ByProviderProtocol
  # would fall through to "no truthful default, return ok=false" and the console
  # would silently auto-fill nothing. This flag is exactly what `default` exists
  # for (kimi's two-host pair already uses it). Routing is unaffected: Default
  # is read only by ByProviderProtocol, never by Lookup/LookupByBaseURL.
  - { host: "open.bigmodel.cn", path_prefix: "/api/anthropic",       protocol: anthropic,         provider: zhipu, base_url: "https://open.bigmodel.cn/api/anthropic",       version: "/v1", default: true }
  - { host: "open.bigmodel.cn", path_prefix: "/api/coding/paas/v4",  protocol: openai_compatible, provider: zhipu, base_url: "https://open.bigmodel.cn/api/coding/paas",  version: "/v4" }
  - { host: "ark.cn-beijing.volces.com",          protocol: openai_compatible, provider: doubao,        base_url: "https://ark.cn-beijing.volces.com/api",      version: "/v3"     }
  - { host: "dashscope.aliyuncs.com",             protocol: openai_compatible, provider: qwen,          base_url: "https://dashscope.aliyuncs.com/compatible-mode", version: "/v1" }
  - { host: "api.siliconflow.cn",                 protocol: openai_compatible, provider: siliconflow,   base_url: "https://api.siliconflow.cn",                 version: "/v1"     }
  - { host: "api-inference.huggingface.co",       protocol: openai_compatible, provider: huggingface,   base_url: "https://api-inference.huggingface.co",       version: "/v1"     }
  - { host: "yunwu.ai",                           protocol: openai_compatible, provider: yunwu,         base_url: "https://yunwu.ai",                           version: "/v1"     }
  - { host: "aicoding.2233.ai",                   protocol: openai_compatible, provider: zeroeleven,    base_url: "https://aicoding.2233.ai",                   version: "/v1"     }

  # ══════════════════════════════════════════════════════════════════════════
  # 2026-08-02 · provider-credential-cascade —— 27 行新增（23 → 50）
  #
  # 纪律：**只加行**。上面 23 行除 open.bigmodel.cn 的 /api/anthropic 按 I-5 补了
  # `default: true` 外，逐字节未动。改既有行的 path_prefix（例如把 dashscope 兜底行
  # 从 "" 改成 "/compatible-mode" 让它"更对称"）会让每一条只填了域名的存量凭据
  # 一行都匹配不上 → LookupByBaseURL 返回 ok=false → 静默路由失败。
  # **兜底行的 "" 是不可动的。**
  #
  # 调研落档（每条带来源链接 + 抓取日期）：
  #   roadmap20260320/技术实现/阶段8-平台化/供应商凭据三级联动/
  #   openspec/changes/provider-credential-cascade/research-provider-endpoints.md
  #
  # tier-B 行带 `# tier-B 待官方复核` 行内注释；codegen 据此在界面打「社区验证」角标
  # （R-7），并登记进「待客户实测复核」清单。🚫 不许悄悄把 B 当 A。
  # ══════════════════════════════════════════════════════════════════════════

  # ── A 档：既有 provider 的 anthropic 第二协议面（本次最大价值）─────────────
  #
  # 🔴 这一组全部是"已知 host + 新 path_prefix"的形状，也正是 P0.5b 场景 A
  # （混版静默错路由）命中的形状：老代理的兜底行永远匹配，/anthropic 段被当噪声
  # 丢弃，Anthropic 请求体打到 OpenAI 端点，且 LookupByBaseURL 返回 ok=true
  # 所以一条 WARN 都不打。R-9 定案 B 已给 stitch.go 补上那条 WARN。
  # 受影响行逐条列举见 mixed-version-affected-rows.md（I-11 围栏读它）。
  - { host: "api.deepseek.com",  path_prefix: "/anthropic", protocol: anthropic,         provider: deepseek, base_url: "https://api.deepseek.com/anthropic", version: "/v1" }
  - { host: "api.moonshot.cn",   path_prefix: "/anthropic", protocol: anthropic,         provider: moonshot, base_url: "https://api.moonshot.cn/anthropic",  version: "/v1", default: true }
  - { host: "api.moonshot.ai",   path_prefix: "/anthropic", protocol: anthropic,         provider: moonshot, base_url: "https://api.moonshot.ai/anthropic",  version: "/v1" }
  - { host: "api.moonshot.ai",                              protocol: openai_compatible, provider: moonshot, base_url: "https://api.moonshot.ai",           version: "/v1" }
  - { host: "dashscope.aliyuncs.com", path_prefix: "/api/v2/apps/claude-code-proxy", protocol: anthropic, provider: qwen, base_url: "https://dashscope.aliyuncs.com/api/v2/apps/claude-code-proxy", version: "/v1" }
  # 🔴 I-4 前缀吞并：/api/coding/v3 必须比 /api/coding 长，否则 openai coding 端点
  #    会被 anthropic 行吞掉 → openai 请求被 anthropic 适配器改写请求体。
  #    Lookup 是段对齐最长前缀匹配，所以只要两行都在表里，更长者自然赢；
  #    危险的是"只写短的那行"—— 客户照样会填 /api/coding/v3。围栏见 P1c.2 / T-2。
  - { host: "ark.cn-beijing.volces.com", path_prefix: "/api/coding",    protocol: anthropic,         provider: doubao, base_url: "https://ark.cn-beijing.volces.com/api/coding", version: "/v1" }
  - { host: "ark.cn-beijing.volces.com", path_prefix: "/api/coding/v3", protocol: openai_compatible, provider: doubao, base_url: "https://ark.cn-beijing.volces.com/api/coding", version: "/v3" }

  # ── A 档：新 provider ──────────────────────────────────────────────────────
  - { host: "api.mistral.ai",     protocol: openai_compatible, provider: mistral,        base_url: "https://api.mistral.ai",              version: "/v1" }
  # MiniMax 国内(minimaxi.com)/国际(minimax.io) —— R-3 定案 A：同一个 code，不拆。
  # 无可区分的 key 前缀特征、无模型目录分叉，与 R-2 (zhipu/z.ai) 同一把尺子。
  - { host: "api.minimaxi.com",   protocol: openai_compatible, provider: minimax,        base_url: "https://api.minimaxi.com",            version: "/v1", default: true }
  - { host: "api.minimax.io",     protocol: openai_compatible, provider: minimax,        base_url: "https://api.minimax.io",              version: "/v1" }
  - { host: "api.minimaxi.com", path_prefix: "/anthropic", protocol: anthropic, provider: minimax, base_url: "https://api.minimaxi.com/anthropic", version: "/v1", default: true }
  - { host: "api.minimax.io",   path_prefix: "/anthropic", protocol: anthropic, provider: minimax, base_url: "https://api.minimax.io/anthropic",   version: "/v1" }
  - { host: "api.stepfun.com",    protocol: openai_compatible, provider: stepfun,        base_url: "https://api.stepfun.com",             version: "/v1" }
  - { host: "api.hunyuan.cloud.tencent.com", protocol: openai_compatible, provider: hunyuan, base_url: "https://api.hunyuan.cloud.tencent.com", version: "/v1" }
  - { host: "qianfan.baidubce.com", protocol: openai_compatible, provider: qianfan,      base_url: "https://qianfan.baidubce.com",        version: "/v2" }
  # 🔴 Together 的规范域名是 api.together.ai（官方文档原文），**不是** api.together.xyz。
  # .xyz 是旧域名，今天仍可用且被大量三方集成沿用，所以两行都进表。
  # .xyz 行的 base_url **指向自己**，🚫 不照 www.kimi.com 的别名写法重写到 .ai ——
  # .xyz 是一个真实可用的 API host，替客户做一个他没要求的域名迁移，会让他明明填了
  # .xyz 却查不出为什么请求打到了别处。能不改写就不改写。
  - { host: "api.together.ai",    protocol: openai_compatible, provider: together,       base_url: "https://api.together.ai",             version: "/v1", default: true }
  - { host: "api.together.xyz",   protocol: openai_compatible, provider: together,       base_url: "https://api.together.xyz",            version: "/v1" }
  - { host: "api.fireworks.ai",   protocol: openai_compatible, provider: fireworks,      base_url: "https://api.fireworks.ai/inference",  version: "/v1" }
  - { host: "api.cerebras.ai",    protocol: openai_compatible, provider: cerebras,       base_url: "https://api.cerebras.ai",             version: "/v1" }
  # 🔴 全表第二个 version: "" 的行（第一个是 api.perplexity.ai）。GitHub Models 的端点
  #    直接是 /inference/chat/completions，没有 version 段。EffectiveUpstream 因此等于
  #    base_url 本身 —— TS 侧拼接必须复刻这个分支，否则会拼出不存在的 /inference/v1。
  - { host: "models.github.ai",   protocol: openai_compatible, provider: github_models,  base_url: "https://models.github.ai/inference",  version: "" }
  - { host: "ai-gateway.vercel.sh", protocol: openai_compatible, provider: vercel_gateway, base_url: "https://ai-gateway.vercel.sh",      version: "/v1" }

  # ── A 档：智谱国际站 api.z.ai —— R-2 定案 A：同一个 code `zhipu`，不拆 `zai` ──
  #
  # 原推荐是拆成 zai，实测证伪：kimi 拆分的真实驱动是**指纹分类器**（sk-kimi-* 前缀
  # 稳定独占 → 可进 confirmed tier），而 zhipu 与 z.ai 的 key 同属上面 zhipu_glm 那条
  # `^[A-Za-z0-9]{20,}\.[A-Za-z0-9]{20,}$` 规则 —— 分类器无论如何分不开，拆出来的
  # `zai` 会是一个永远没有任何自动路径能填进去的死码。且两平台服务同一批 GLM 模型，
  # 共享上面的 provider_model_maps 是收益不是代价。
  - { host: "api.z.ai", path_prefix: "/api/anthropic", protocol: anthropic,         provider: zhipu, base_url: "https://api.z.ai/api/anthropic", version: "/v1" }
  - { host: "api.z.ai", path_prefix: "/api/paas",      protocol: openai_compatible, provider: zhipu, base_url: "https://api.z.ai/api/paas",      version: "/v4" }   # tier-B 待官方复核

  # ── 🚫 本地模型（ollama / lmstudio / vllm）不进表 —— R-5 定案 C ─────────────
  # 表是 host-keyed 且 HostFromURL 返回的 u.Host **含端口**。写死 localhost:11434 只
  # 覆盖"恰好默认端口 + 恰好写 localhost"这一种巧合；用 127.0.0.1、局域网 IP 或改过
  # 端口的用户全部 miss，走的还是 Stitch 的 literal-prepend 降级路径 —— 也就是说
  # 进表与不进表在绝大多数真实情况下行为完全相同。而在私有化部署里 localhost 指谁的
  # 机器取决于**代理跑在哪**，预置一个"官方供应商"身份的本机地址是错的且错得隐蔽。
  # ✅ 替代：三方模式加一段「接入本地模型」引导文案（零表行、零新数据，见 P3b.12）。

  # ── B 档：进表并标注，首个客户接入后回收结论 ───────────────────────────────
  # 🔴 sambanova 与 aihubmix 两条是"去抓了官方文档、但官方文档自己没写 base_url"的
  #    结果（sambanova 官方页正文是占位符 your-sambanova-base-url），不是"没去查"。
  - { host: "api.sambanova.ai", protocol: openai_compatible, provider: sambanova, base_url: "https://api.sambanova.ai", version: "/v1" }   # tier-B 待官方复核
  - { host: "aihubmix.com",     protocol: openai_compatible, provider: aihubmix,  base_url: "https://aihubmix.com",     version: "/v1", default: true }   # tier-B 待官方复核
  - { host: "api.aihubmix.com", protocol: openai_compatible, provider: aihubmix,  base_url: "https://api.aihubmix.com", version: "/v1" }   # tier-B 待官方复核（备域名）
  - { host: "api.302.ai",       protocol: openai_compatible, provider: ai302,     base_url: "https://api.302.ai",       version: "/v1" }   # tier-B 待官方复核

# v4.1 Stage 5+: 聚合网关 family 清单 (UI Provider 字段 multi-select 设计驱动)
#
# 含义:这些 family 同时支持多种底层 API 协议 (例如 0011/zeroeleven 同时挂 anthropic + openai),
# 因此 fingerprint 推断不出"严格协议类型",`protocol_types` 字段输出 `[]` 而非 `[family]`,
# 让 UI multi-select 由用户手选实际启用的协议。
#
# 派生规则 (FingerprintClassifier::protocol_types_for_family):
#   family ∈ aggregator_families  → []        (UI 让用户手选)
#   其他 family (官方厂商)         → [family]  (单元素)
aggregator_families:
  - openrouter
  - yunwu           # 云雾 yunwu.ai
  - zeroeleven      # 0011.ai
  # 2026-08-02 provider-credential-cascade 新增。判据与上面三家一致：这些 family
  # 前面挂着多家底层厂商的多种协议，fingerprint 推断不出"严格协议类型"。
  - aihubmix        # 🆕 aihubmix.com（500+ 模型聚合，tier-B）
  - ai302           # 🆕 302.ai（tier-B）
  - vercel_gateway  # 🆕 Vercel AI Gateway（一个 key 打通数百模型）
  - github_models   # 🆕 GitHub Models（openai/anthropic/google/meta 同域分发）

# ── provider_model_maps (P1 / design D-2): per-provider-CODE 模型名映射 ──────────
#
# 解 R-A：让「客户端固定用某模型名、上游真实模型名不同」的接入无需改客户端即可打通。
# 键 = provider CODE（对齐 provider_routes.provider），故独立成 code-keyed 段：
#   - 🚫 不挂 provider_routes 行（一 provider 多端点行会重复 = 分裂真相源，禁止 #13）
#   - 🚫 不挂 classifier `providers` 段（那段按 classifier id 键控，非 provider code）
#   仿 family_login_urls 的 per-key map 先例。查表：路由行定出 provider → ModelMapFor(provider)。
#
# match ∈ { 字面 client id "claude-opus-4-8" | 角色 opus/sonnet/haiku/fable | 通配 "*" }
# 匹配序（精确 > 角色 > 通配，歧义不猜，design D-3）；requested_model = 上游真实模型名。
# unmatched ∈ { reject（异模型上游默认）| passthrough（官方同名） }。
# 构建期校验（ValidateModelMaps）：规则歧义 → MODEL_MAPPING_AMBIGUOUS；字面 claude-* 须 is_claude_safe；
#   🚫 任何 secret 形态字符串。
provider_model_maps:
  - provider: zhipu
    unmatched: reject
    models:
      # 角色键控：Claude 升版本（4-8→4-9）映射不失效，且不触发发版（design D-3）
      - { match: "opus",   requested_model: "glm-4.6" }
      - { match: "sonnet", requested_model: "glm-4.5" }
      - { match: "haiku",  requested_model: "glm-4.5-air" }
      # 字面精确：需要钉具体版本时用（精确优先于角色）
      - { match: "claude-opus-4-8", requested_model: "glm-4.6" }

providers:
  # ============ Tier: confirmed（前缀高特异性，直接打上provider标签） ============

  - id: anthropic_api
    display: "Anthropic Claude (API key)"
    # 2024 Q4 起 Claude key 可能为 60-130 字符尾段，取宽容范围
    regex: '^sk-ant-api03-[A-Za-z0-9_\-]{40,150}$'
    length_range: [53, 165]
    tier: confirmed

  - id: anthropic_oauth
    display: "Anthropic Claude (OAuth setup token)"
    regex: '^sk-ant-oat01-[A-Za-z0-9_\-]{20,}$'
    tier: confirmed

  - id: openai_project
    display: "OpenAI (Project key)"
    regex: '^sk-proj-[A-Za-z0-9_\-]{40,200}$'
    length_range: [50, 210]
    tier: confirmed

  - id: openai_admin
    display: "OpenAI (Admin key)"
    regex: '^sk-admin-[A-Za-z0-9_\-]{100,150}$'
    tier: confirmed

  - id: openai_svcacct
    display: "OpenAI (Service Account)"
    regex: '^sk-svcacct-[A-Za-z0-9_\-]+$'
    tier: confirmed

  - id: openrouter
    display: "OpenRouter"
    # 真实 key 是 64 hex，但允许更宽字符集以兼容未来格式变化 + 合成样本
    regex: '^sk-or-v1-[A-Za-z0-9]{50,80}$'
    length_range: [59, 90]
    tier: confirmed

  - id: google_gemini
    display: "Google Gemini / Google Cloud API"
    regex: '^AIza[0-9A-Za-z_\-]{35}$'
    length_range: [39, 39]
    tier: confirmed

  - id: groq
    display: "Groq"
    regex: '^gsk_[A-Za-z0-9]{48,64}$'
    length_range: [52, 68]
    tier: confirmed

  - id: xai_grok
    display: "xAI Grok"
    regex: '^xai-[A-Za-z0-9]{60,100}$'
    length_range: [64, 104]
    tier: confirmed

  - id: github_classic
    display: "GitHub (Classic PAT)"
    regex: '^ghp_[a-zA-Z0-9]{36}$'
    length_range: [40, 40]
    tier: confirmed

  - id: github_fine_grained
    display: "GitHub (Fine-grained PAT)"
    regex: '^github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}$'
    length_range: [93, 93]
    tier: confirmed

  - id: aws_access_key
    display: "AWS Access Key ID"
    regex: '^AKIA[0-9A-Z]{16}$'
    length_range: [20, 20]
    tier: confirmed

  - id: stripe_live
    display: "Stripe (Live Secret Key)"
    regex: '^sk_live_[0-9a-zA-Z]{24}$'
    length_range: [32, 32]
    tier: confirmed

  - id: stripe_restricted
    display: "Stripe (Restricted Key)"
    regex: '^rk_live_[0-9a-zA-Z]{99}$'
    length_range: [107, 107]
    tier: confirmed

  - id: sendgrid
    display: "SendGrid"
    # 真实 key: SG.{22}.{43} 共 69；合成样本允许更宽长度
    regex: '^SG\.[A-Za-z0-9_\-]{10,30}\.[A-Za-z0-9_\-]{20,60}$'
    length_range: [34, 94]
    tier: confirmed

  - id: slack_bot
    display: "Slack Bot Token"
    regex: '^xoxb-[0-9]+-[0-9]+-[0-9a-zA-Z]+$'
    tier: confirmed

  - id: slack_user
    display: "Slack User Token"
    regex: '^xoxp-[0-9]+-[0-9]+-[0-9]+-[0-9a-zA-Z]+$'
    tier: confirmed

  - id: huggingface
    display: "Hugging Face"
    regex: '^hf_[A-Za-z]{30,40}$'
    length_range: [33, 45]
    tier: confirmed

  - id: perplexity
    display: "Perplexity AI"
    regex: '^pplx-[A-Za-z0-9]{40,}$'
    tier: confirmed

  - id: generic_jwt
    display: "JWT (generic, multiple providers)"
    regex: '^eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+$'
    tier: confirmed

  - id: pem_block
    display: "PEM private key block (SSH / TLS / PGP)"
    regex: '^-----BEGIN [A-Z ]+-----[\s\S]+-----END [A-Z ]+-----$'
    tier: confirmed

  # 2026-05-08 Kimi 双平台拆分：sk-kimi-* 前缀稳定且独占 → confirmed tier。
  # Why 必须在 generic_sk 之前：Rust regex crate 不支持 lookahead，无法在 generic_sk
  # 写 `^sk-(?!kimi-)...`；first-match-wins YAML 顺序保证 sk-kimi-* key 走精确分支，
  # 其余 sk-* key 落到 generic_sk ambiguous bucket（Moonshot / DeepSeek / yunwu 等）。
  - id: kimi_code
    display: "Kimi Code (api.kimi.com)"
    regex: '^sk-kimi-[A-Za-z0-9_\-]{20,}$'
    tier: confirmed

  # ============ Tier: ambiguous（sk- 通用前缀，需上下文补强） ============

  - id: zhipu_glm
    display: "Zhipu AI / GLM (BigModel)"
    # 两段 id.secret 格式
    regex: '^[A-Za-z0-9]{20,}\.[A-Za-z0-9]{20,}$'
    tier: ambiguous
    hint: "Zhipu 格式为 {id}.{secret}，但其他 provider 也可能使用 dot-separated"
    # M3 新增
    siblings:
      - zhipu_glm
      - bigmodel
      - generic_other

  - id: generic_sk
    display: "Generic sk- key (Kimi / DeepSeek / 云雾 / 0011 / Mistral 等)"
    regex: '^sk-[A-Za-z0-9]{40,80}$'
    length_range: [43, 83]
    tier: ambiguous
    hint: "通用 sk- 前缀，需结合同文档 URL/title 判定具体 provider"
    # v4.1 family rename: 'moonshot_kimi' → 'kimi' 与 connectivity/runtime PROVIDER_DEFAULTS 字典对齐
    # (CLI 其他地方一律叫 'kimi';UI Provider 字段直接消费此值,避免名词分裂)
    # 2026-05-08 Kimi 双平台拆分: provider_code 'kimi' 拆为 'moonshot' + 'kimi_code'
    #   - sk-kimi-* 前缀已被前置 confirmed 规则吃掉(id=kimi_code),不会到这里。
    #   - 落到 generic_sk 的 sk-* key 默认归 'moonshot'(用户决策 #4);URL host 强证据
    #     可下钻到 kimi_code(api.kimi.com / www.kimi.com)。
    disambiguators:
      - url_domain: "platform.moonshot.cn"
        suggest: "moonshot"
      - url_domain: "api.moonshot.cn"
        suggest: "moonshot"
      - url_domain: "platform.moonshot.ai"
        suggest: "moonshot"
      - url_domain: "api.kimi.com"
        suggest: "kimi_code"
      - url_domain: "www.kimi.com"
        suggest: "kimi_code"
      - url_domain: "platform.deepseek.com"
        suggest: "deepseek"
      - url_domain: "yunwu.ai"
        suggest: "yunwu"
      - url_domain: "0011.ai"
        suggest: "zeroeleven"
    # M3 新增：URL 消歧失败时，UI 手选下拉优先展示的候选 provider id
    siblings:
      - moonshot
      - kimi_code
      - deepseek
      - yunwu
      - zeroeleven
      - mistral
      - siliconflow
      - generic_other

  # ============ Tier: warn（形态可疑，UI 需标警示） ============

  - id: uuid
    display: "UUID (通常不是 API KEY)"
    regex: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    length_range: [36, 36]
    tier: warn
    hint: "看起来像 UUID（订单号/会话ID/资源标识），用户需确认是否为凭证"

  - id: short_hex_raw
    display: "Short raw hex（可能是 file hash / 版本号 / 资源 ID）"
    regex: '^[a-fA-F0-9]{16,27}$'
    length_range: [16, 27]
    tier: warn
    hint: "短 hex 串，可能是 commit hash / file hash / 资源 ID，请确认"
